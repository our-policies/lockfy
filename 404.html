<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Lockfy</title>
<meta name="theme-color" content="#06070A">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<!-- GitHub Pages serves this file from any path, so links are root-relative to the site folder via <base>. Adjust if hosted under a sub-path. -->
<script>
  // Works at the domain root or under a project sub-path (user.github.io/repo/).
  (function () { var p = location.pathname.split("/").filter(Boolean); var base = document.createElement("base");
    base.href = location.hostname.endsWith("github.io") && p.length ? "/" + p[0] + "/" : "/"; document.head.appendChild(base); })();
</script>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<header class="nav">
  <div class="wrap"><a class="brand" href="./"><img src="assets/img/apple-touch-icon.png" alt="" width="32" height="32">Lockfy</a></div>
</header>
<main class="notfound">
  <div class="wrap">
    <h1 class="grad">404</h1>
    <p style="color:var(--muted);font-size:18px">This page doesn't exist.</p>
    <p style="margin-top:28px"><a class="btn" href="./">Back to Lockfy</a></p>
  </div>
</main>
</body>
</html>
